version: '3.8'

services:
  app:
    build: .
    container_name: pbl_monitoring_system
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    working_dir: /app
    ports:
      - "8000:8000"
    devices:
      - /dev/video0:/dev/video0  # Camera access
    network_mode: host
    stdin_open: true
    tty: true
    command: bash

