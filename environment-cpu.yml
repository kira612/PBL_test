name: lab_monitoring_cpu
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - opencv
  - numpy>=1.24.0
  - scipy>=1.10.0
  - matplotlib>=3.7.0
  - pillow>=10.0.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - scikit-image>=0.20.0
  - pyyaml>=6.0.0
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly  # CPU版PyTorch
  - pip
  - pip:
    # YOLO for object detection
    - ultralytics>=8.0.0
    
    # MediaPipe for pose estimation and tracking
    - mediapipe>=0.10.0
    
    # Deep learning frameworks (additional)
    - tensorflow>=2.12.0
    
    # Advanced depth estimation models
    - transformers>=4.30.0
    - timm>=0.9.0
    
    # Web framework for dashboard
    - flask>=3.0.0
    - fastapi>=0.100.0
    - uvicorn>=0.20.0
    
    # Configuration and utilities
    - python-dotenv>=1.0.0
    - click>=8.0.0
    
    # Development and testing tools
    - pytest>=7.4.0
    - pytest-cov>=4.0.0
    - pytest-asyncio>=0.21.0
    - anyio>=3.7.0,<4.0.0
    - black>=23.0.0
    - ruff>=0.1.0
    - pyright>=1.1.300
    
    # Logging and monitoring
    - loguru>=0.7.0
